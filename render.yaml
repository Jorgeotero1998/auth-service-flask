services:
  - type: web
    name: auth-service-flask-api
    env: docker
    plan: free
    autoDeploy: true
    dockerfilePath: docker/api/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: auth-service-flask-db
          property: connectionString

databases:
  - name: auth-service-flask-db
    plan: free
    databaseName: app
    user: postgres

