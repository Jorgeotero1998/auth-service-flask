[project]
name = "auth-service-flask"
version = "0.1.0"
description = "Auth service (Flask) with JWT access/refresh."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.0.0",
  "gunicorn>=22.0.0",
  "python-dotenv>=1.0.0",
  "PyJWT>=2.8.0",
  "SQLAlchemy>=2.0.30",
  "psycopg2-binary>=2.9.9",
  "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

